<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Affiche Joyeuse Année – Global Génie Électrique</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf7f2;--card:#ffffff;--text:#231f1c;--muted:#6f675f;--line:#e4ddd3;--red:#d3191a;--red-d:#a91213;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171412;--card:#221e1b;--text:#f3eee8;--muted:#b0a79d;--line:#38312c;--red:#e5302f;--red-d:#c32322;color-scheme:dark}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Montserrat,system-ui,Arial,sans-serif;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 370px;align-items:start}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.left{position:sticky;top:12px}
@media(max-width:900px){.left{position:static}}
.preview{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:pan-y}
canvas.drag{cursor:grab}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px 16px}
details{border-bottom:1px solid var(--line);padding:4px 0}
summary{cursor:pointer;font-weight:700;font-size:14px;padding:10px 0;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"–"}
summary::-webkit-details-marker{display:none}
.sec{display:grid;gap:12px;padding:2px 0 12px}
label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
label b{color:var(--text);font-weight:600}
input[type=text],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);font:inherit;font-size:14px}
input:focus,select:focus{outline:2px solid var(--red);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--red)}
input[type=color]{width:100%;height:38px;padding:2px;border:1px solid var(--line);border-radius:9px;background:var(--bg);cursor:pointer}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;cursor:pointer}
.chk input{accent-color:var(--red);width:16px;height:16px}
.btn{appearance:none;border:0;border-radius:9px;padding:10px 12px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;width:100%}
.primary{background:var(--red);color:#fff;padding:12px}.primary:hover{background:var(--red-d)}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}.ghost:hover{background:var(--bg)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.zrow{display:grid;grid-template-columns:42px 1fr 42px;gap:8px;align-items:center}
.zrow .btn{padding:8px 0;font-size:18px;line-height:1}
.hint{font-size:12px;color:var(--muted);margin:0}
.status{font-size:12px;color:var(--muted);min-height:16px;margin:8px 0 0}
.foot{display:grid;gap:8px;padding-top:14px}
.needphoto.off{opacity:.45;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <h1>Affiche « Joyeuse Année »</h1>
    <p class="sub">Modifiez l’affiche puis téléchargez-la en haute définition.</p>
    <div class="preview"><canvas id="cv" width="2576" height="2576"></canvas></div>
  </div>

  <div class="panel">
    <details open>
      <summary>Texte</summary>
      <div class="sec">
        <div><label for="nom">Nom (en haut)</label><input id="nom" type="text" autocomplete="off"></div>
        <div><label for="pre">Prénom</label><input id="pre" type="text" autocomplete="off"></div>
        <div class="r2">
          <label class="chk"><input type="checkbox" id="upN"> Nom en majuscules</label>
          <label class="chk"><input type="checkbox" id="upP"> Prénom en majuscules</label>
        </div>
        <div><label for="size">Taille du texte <b data-v="size" data-s="%"></b></label><input id="size" type="range" min="50" max="130" step="1"></div>
        <div class="r3">
          <div><label for="c1">Case nom</label><input id="c1" type="color"></div>
          <div><label for="c2">Case prénom</label><input id="c2" type="color"></div>
          <div><label for="ct">Texte</label><input id="ct" type="color"></div>
        </div>
      </div>
    </details>

    <details open>
      <summary>Photo</summary>
      <div class="sec">
        <input id="file" type="file" accept="image/*" hidden>
        <button class="btn ghost" id="pick" type="button">Choisir une photo…</button>
        <div id="photoCtl" class="needphoto off" style="display:grid;gap:12px">
          <div>
            <label>Zoom <b data-v="zoom" data-s="%" data-m="100"></b></label>
            <div class="zrow">
              <button class="btn ghost" id="zout" type="button" aria-label="Dézoomer">−</button>
              <input id="zoom" type="range" min="0.2" max="4" step="0.01">
              <button class="btn ghost" id="zin" type="button" aria-label="Zoomer">+</button>
            </div>
          </div>
          <div class="r2">
            <button class="btn ghost" id="fill" type="button">Remplir le cadre</button>
            <button class="btn ghost" id="fit" type="button">Photo entière</button>
          </div>
          <div><label for="fine">Inclinaison fine <b data-v="fine" data-s="°"></b></label><input id="fine" type="range" min="-45" max="45" step="0.5"></div>
          <div class="r2">
            <button class="btn ghost" id="rl" type="button">↺ 90° gauche</button>
            <button class="btn ghost" id="rr" type="button">↻ 90° droite</button>
          </div>
          <div class="r3">
            <button class="btn ghost" id="fh" type="button">⇆ Miroir</button>
            <button class="btn ghost" id="fv" type="button">⇅ Retourner</button>
            <button class="btn ghost" id="ctr" type="button">Centrer</button>
          </div>
          <div><label for="bri">Luminosité <b data-v="bri" data-s="%"></b></label><input id="bri" type="range" min="50" max="150"></div>
          <div><label for="con">Contraste <b data-v="con" data-s="%"></b></label><input id="con" type="range" min="50" max="150"></div>
          <div><label for="sat">Saturation <b data-v="sat" data-s="%"></b></label><input id="sat" type="range" min="0" max="200"></div>
          <label class="chk"><input type="checkbox" id="bw"> Noir et blanc</label>
          <p class="hint">Glissez la photo dans le cadre. Molette ou pincement pour zoomer.</p>
          <button class="btn ghost" id="rmphoto" type="button">Retirer la photo</button>
        </div>
      </div>
    </details>

    <details>
      <summary>Cadre</summary>
      <div class="sec">
        <div class="r2">
          <div><label for="bc">Couleur du contour</label><input id="bc" type="color"></div>
          <div><label for="fill_c">Fond (si dézoom)</label><input id="fill_c" type="color"></div>
        </div>
        <div><label for="bt">Épaisseur du contour <b data-v="bt" data-s=" px"></b></label><input id="bt" type="range" min="0" max="30"></div>
        <div><label for="br">Arrondi des coins <b data-v="br" data-s=" px"></b></label><input id="br" type="range" min="0" max="86"></div>
      </div>
    </details>

    <details open>
      <summary>Exporter</summary>
      <div class="sec">
        <div class="r2">
          <div><label for="fmt">Format</label>
            <select id="fmt"><option value="png">PNG (qualité max)</option><option value="jpg">JPG (plus léger)</option></select></div>
          <div><label for="px">Taille</label>
            <select id="px"><option value="2576">HD 2576 px</option><option value="2000">2000 px</option><option value="1080">1080 px (WhatsApp)</option></select></div>
        </div>
        <button class="btn primary" id="dl" type="button">Télécharger</button>
        <button class="btn ghost" id="share" type="button" style="display:none">Partager (WhatsApp…)</button>
      </div>
    </details>

    <div class="foot">
      <button class="btn ghost" id="reset" type="button">Réinitialiser tous les réglages</button>
      <p class="status" id="st"></p>
    </div>
  </div>
</div>

const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
const F={x:773,y:455,w:1082,h:1048,r:86};
const BOX={h:123,black:{x:1128,w:373,cx:1314,y:112},red:{x:1031,w:613,cx:1337,y:233}};
const FONT='Montserrat, Arial, sans-serif';
const D={nom:'SANA',pre:'Mohamadi',upN:true,upP:false,size:100,c1:'#000000',c2:'#d3191a',ct:'#ffffff',
 zoom:1,fine:0,rot:0,fh:false,fv:false,bri:100,con:100,sat:100,bw:false,bc:'#d3191a',fill_c:'#ece8df',bt:8,br:86,fmt:'png',px:'2576'};
let S={...D},base=new Image(),photo=null,ox=0,oy=0,ready=false;

/* ---------- dessin ---------- */
function rr(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function nameBox(b,text,color){
  const size=96*S.size/100;
  ctx.font='700 '+size+'px '+FONT;
  const tw=ctx.measureText(text).width;
  const w=Math.max(b.w+4,Math.ceil(tw+76));
  ctx.fillStyle=color;ctx.fillRect(b.cx-w/2,b.y-1,w,BOX.h+2);
  ctx.fillStyle=S.ct;ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.fillText(text,b.cx,b.y+BOX.h/2+size*0.35);
}
function dims(){
  const sw=S.rot%2!==0;
  const ew=sw?photo.height:photo.width, eh=sw?photo.width:photo.height;
  return {ew,eh,cover:Math.max(F.w/ew,F.h/eh),contain:Math.min(F.w/ew,F.h/eh)};
}
function draw(){
  if(!ready)return;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(base,0,0,cv.width,cv.height);
  let n=S.nom.trim(),p=S.pre.trim();
  if(S.upN)n=n.toUpperCase();if(S.upP)p=p.toUpperCase();
  if(n)nameBox(BOX.black,n,S.c1);
  if(p)nameBox(BOX.red,p,S.c2);
  if(!photo)return;
  const d=dims(),s=d.cover*S.zoom;
  ox=Math.max(-F.w,Math.min(F.w,ox));oy=Math.max(-F.h,Math.min(F.h,oy));
  ctx.save();
  rr(F.x-2,F.y-2,F.w+4,F.h+4,S.br);ctx.clip();
  ctx.fillStyle=S.fill_c;ctx.fillRect(F.x-2,F.y-2,F.w+4,F.h+4);
  ctx.translate(F.x+F.w/2+ox,F.y+F.h/2+oy);
  ctx.rotate((S.rot*90+S.fine)*Math.PI/180);
  ctx.scale(S.fh?-1:1,S.fv?-1:1);
  ctx.filter='brightness('+S.bri+'%) contrast('+S.con+'%) saturate('+S.sat+'%)'+(S.bw?' grayscale(1)':'');
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(photo,-photo.width*s/2,-photo.height*s/2,photo.width*s,photo.height*s);
  ctx.restore();
  ctx.filter='none';
  if(S.bt>0){
    ctx.lineWidth=S.bt;ctx.strokeStyle=S.bc;
    rr(F.x+S.bt/2,F.y+S.bt/2,F.w-S.bt,F.h-S.bt,Math.max(0,S.br-S.bt/2));ctx.stroke();
  }
}

/* ---------- commandes ---------- */
function sync(){
  for(const k in D){const el=$(k);if(!el)continue;
    if(el.type==='checkbox')el.checked=S[k];else el.value=S[k];}
  document.querySelectorAll('[data-v]').forEach(b=>{
    const k=b.dataset.v,m=+(b.dataset.m||1);
    b.textContent=Math.round(S[k]*m)+(b.dataset.s||'');
  });
  $('photoCtl').classList.toggle('off',!photo);
  cv.classList.toggle('drag',!!photo);
}
for(const k in D){
  const el=$(k);if(!el)continue;
  el.addEventListener('input',()=>{
    S[k]=el.type==='checkbox'?el.checked:(el.type==='range'?+el.value:el.value);
    sync();draw();
  });
}
const setZoom=z=>{S.zoom=Math.max(0.2,Math.min(4,z));sync();draw()};
$('zin').onclick=()=>setZoom(S.zoom+0.1);
$('zout').onclick=()=>setZoom(S.zoom-0.1);
$('fill').onclick=()=>{setZoom(1);ox=oy=0;draw()};
$('fit').onclick=()=>{if(!photo)return;const d=dims();S.zoom=d.contain/d.cover;ox=oy=0;sync();draw()};
$('rl').onclick=()=>{S.rot=(S.rot+3)%4;sync();draw()};
$('rr').onclick=()=>{S.rot=(S.rot+1)%4;sync();draw()};
$('fh').onclick=()=>{S.fh=!S.fh;draw()};
$('fv').onclick=()=>{S.fv=!S.fv;draw()};
$('ctr').onclick=()=>{ox=oy=0;draw()};
$('rmphoto').onclick=()=>{photo=null;ox=oy=0;$('file').value='';$('st').textContent='';sync();draw()};
$('reset').onclick=()=>{S={...D};ox=oy=0;$('st').textContent='';sync();draw()};

async function loadPhoto(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
  photo=bmp;Object.assign(S,{zoom:1,fine:0,rot:0,fh:false,fv:false});ox=oy=0;
  $('st').textContent='Photo importée : '+photo.width+' × '+photo.height+' px';
  sync();draw();
}
$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(f)loadPhoto(f).catch(()=>{$('st').textContent='Impossible de lire cette image.'})};

/* ---------- déplacement, molette, pincement ---------- */
const ptrs=new Map();let g=null;
const pos=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*cv.width/r.width,y:(e.clientY-r.top)*cv.height/r.height}};
const inFrame=p=>p.x>=F.x&&p.x<=F.x+F.w&&p.y>=F.y&&p.y<=F.y+F.h;
cv.addEventListener('pointerdown',e=>{
  if(!photo)return;const p=pos(e);
  if(!inFrame(p)&&ptrs.size===0)return;
  ptrs.set(e.pointerId,p);cv.setPointerCapture(e.pointerId);cv.style.touchAction='none';e.preventDefault();
  g=startG();
});
function startG(){
  const a=[...ptrs.values()];
  if(a.length>=2)return{t:'pinch',d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),z:S.zoom};
  return{t:'pan',x:a[0].x,y:a[0].y,ox,oy};
}
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;
  ptrs.set(e.pointerId,pos(e));const a=[...ptrs.values()];
  if(g.t==='pinch'&&a.length>=2){
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    S.zoom=Math.max(0.2,Math.min(4,g.z*d/g.d));sync();draw();
  }else if(g.t==='pan'&&a.length===1){
    ox=g.ox+(a[0].x-g.x);oy=g.oy+(a[0].y-g.y);draw();
  }
});
const end=e=>{ptrs.delete(e.pointerId);if(ptrs.size)g=startG();else{g=null;cv.style.touchAction='pan-y'}};
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
cv.addEventListener('wheel',e=>{
  if(!photo||!inFrame(pos(e)))return;
  e.preventDefault();setZoom(S.zoom*Math.exp(-e.deltaY*0.0015));
},{passive:false});

/* ---------- export ---------- */
function fname(ext){
  const s=((S.nom+'_'+S.pre).trim()||'affiche').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w-]+/g,'_');
  return 'Joyeuse_Annee_'+s+'.'+ext;
}
function makeBlob(){
  const size=+S.px,ext=S.fmt,type=ext==='png'?'image/png':'image/jpeg';
  let src=cv;
  if(size!==cv.width){
    src=document.createElement('canvas');src.width=src.height=size;
    const c=src.getContext('2d');c.imageSmoothingQuality='high';c.drawImage(cv,0,0,size,size);
  }
  return new Promise(r=>src.toBlob(b=>r({blob:b,ext,type}),type,0.95));
}
$('dl').onclick=async()=>{
  const {blob,ext}=await makeBlob();
  if(!blob){$('st').textContent='Échec de la génération.';return}
  let d=null;try{if(window.claude&&claude.use)d=await claude.use('downloads')}catch(e){}
  if(d){
    try{await d.save({filename:fname(ext),data:blob});$('st').textContent='Fichier enregistré.'}
    catch(e){$('st').textContent=(e&&e.code==='declined')?'Téléchargement annulé.':'Téléchargement impossible ici.'}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname(ext);
  document.body.appendChild(a);a.click();a.remove();$('st').textContent='Fichier téléchargé.';
};
try{const t=new File(['x'],'t.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[t]}))$('share').style.display='block'}catch(e){}
$('share').onclick=async()=>{
  const {blob,ext,type}=await makeBlob();
  try{await navigator.share({files:[new File([blob],fname(ext),{type})],title:'Joyeuse Année'})}catch(e){}
};

/* ---------- démarrage ---------- */
(async()=>{
  sync();
  base.src=SRC;await base.decode();
  try{await Promise.race([document.fonts.load('700 96px Montserrat'),new Promise(r=>setTimeout(r,2500))])}catch(e){}
  cv.width=base.naturalWidth;cv.height=base.naturalHeight;
  ready=true;draw();
})();
</script>
